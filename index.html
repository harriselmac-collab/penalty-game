<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08111d">
<title>ركلة الحسم - ماجد للتوقعات</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="preload" href="assets/stadium-v2.webp" as="image" type="image/webp">
<link rel="preload" href="assets/keeper.webp" as="image" type="image/webp">
<link rel="preload" href="assets/ball-v2.webp" as="image" type="image/webp">
<style>
:root{
  --shell:#08111d;
  --shell-2:#101d2b;
  --panel:#132638;
  --line:#31516e;
  --text:#f7fbff;
  --muted:#a9bdd0;
  --cyan:#48d7ff;
  --gold:#ffd34f;
  --green:#35df87;
  --red:#ff5968;
  --display:'Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;
  --body:'Tajawal','Segoe UI',Tahoma,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--shell);color:var(--text);font-family:var(--body);user-select:none}
button{font:inherit}
#app{position:relative;display:flex;flex-direction:column;width:100%;max-width:520px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--shell)}
@supports not (height:100dvh){#app{height:100vh}}

.topbar{position:relative;z-index:10;flex:0 0 auto;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--shell-2);border-bottom:1px solid var(--line)}
.topline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:44px}
.team{display:flex;align-items:center;gap:7px;min-width:0}
.team.away{justify-content:flex-end;text-align:end}
.flag{flex:0 0 auto;font-size:26px;line-height:1}
.team-copy{min-width:0}
.team-label{display:block;color:var(--muted);font-size:10px;font-weight:700;line-height:1.1}
.team-name{display:block;overflow:hidden;font-family:var(--display);font-size:14px;font-weight:800;line-height:1.3;text-overflow:ellipsis;white-space:nowrap}
.score{display:flex;min-width:64px;height:44px;align-items:center;justify-content:center;gap:5px;border:1px solid #3d627e;border-radius:8px;background:#0b1724;font-family:var(--display);font-size:25px;font-weight:800}
.score small{color:var(--gold);font-family:var(--body);font-size:11px}
.progress-row{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:7px;direction:ltr}
.progress-step{height:5px;border-radius:2px;background:#284156;transition:background .2s,transform .2s}
.progress-step.on{background:var(--gold);transform:scaleY(1.35)}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:7px;color:var(--muted);font-size:11px;font-weight:700}
.reward-label,.lives{display:flex;align-items:center;gap:5px}
.reward-label img{width:17px;height:17px;object-fit:contain}
.life{color:var(--red);font-size:15px;transition:opacity .2s,transform .2s}
.life.lost{opacity:.25;transform:scale(.72)}
.sound{display:grid;width:34px;height:34px;place-items:center;border:1px solid #3d627e;border-radius:8px;background:#0b1724;color:var(--text);font-size:15px;cursor:pointer}
.sound:active{transform:scale(.94)}

.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#0a4124}
.stadium{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;pointer-events:none}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,11,24,.15) 0%,transparent 46%,rgba(3,11,14,.42) 100%);pointer-events:none}
.goal-zone{position:absolute;top:42%;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);opacity:.45;filter:drop-shadow(0 0 8px rgba(255,211,79,.5));pointer-events:none}
.goal-zone.left{left:29%}.goal-zone.right{left:71%}
.goal-zone img{display:block;width:100%;height:100%;object-fit:contain}
.goal-zone::after{content:'';position:absolute;inset:18%;border:1px solid rgba(255,255,255,.62);border-radius:50%}
.aim-cursor{position:absolute;left:50%;top:45%;z-index:7;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;will-change:left}
.aim-cursor img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 8px rgba(72,215,255,.8));transition:filter .15s,transform .15s}
.aim-cursor.hot img{filter:drop-shadow(0 0 13px rgba(255,211,79,1));transform:scale(1.08)}
.aim-cursor.locked img{animation:lock .34s var(--ease)}
.keeper{position:absolute;left:50%;top:52%;z-index:5;width:29%;height:auto;transform:translate(-50%,-50%);transform-origin:50% 80%;filter:drop-shadow(0 7px 5px rgba(0,0,0,.5));transition:left .35s var(--ease),top .35s var(--ease),width .2s var(--ease),transform .35s var(--ease);will-change:left,top,transform}
.keeper.idle{animation:ready 1.8s ease-in-out infinite}
.keeper.dive{top:48%;width:48%}
.keeper.dive.left{left:31%}.keeper.dive.right{left:69%}
.keeper.dive.center{left:50%;width:31%;transform:translate(-50%,-66%) scale(1.08)}
.kicker{position:absolute;left:39%;top:100%;z-index:6;width:22%;height:auto;transform:translate(-50%,-100%);transform-origin:50% 100%;filter:drop-shadow(0 9px 7px rgba(0,0,0,.55));will-change:transform}
.kicker.kick{animation:kick .48s cubic-bezier(.4,0,.2,1)}
.ball{position:absolute;left:50%;top:68%;z-index:8;width:12%;height:auto;transform:translate(-50%,-50%) scale(1) rotate(0);filter:drop-shadow(0 5px 4px rgba(0,0,0,.48));transition:left .52s cubic-bezier(.18,.72,.28,1),top .52s cubic-bezier(.18,.72,.28,1),transform .52s cubic-bezier(.18,.72,.28,1);will-change:left,top,transform}
.net-flash{position:absolute;inset:32% 18% auto;height:24%;z-index:4;opacity:0;border:2px solid rgba(255,255,255,.25);border-radius:8px;pointer-events:none}
.net-flash.goal{animation:net .48s ease-out}
.impact{position:absolute;inset:0;z-index:9;opacity:0;pointer-events:none}
.impact.goal{background:radial-gradient(circle at var(--hit-x) 44%,rgba(255,220,80,.52),transparent 23%);animation:flash .5s ease-out}
.impact.save{background:radial-gradient(circle at var(--hit-x) 44%,rgba(255,60,80,.5),transparent 27%);animation:flash .5s ease-out}
.status{position:absolute;top:14%;left:50%;z-index:12;min-width:148px;padding:7px 14px;transform:translate(-50%,-10px);border:1px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(5,14,25,.84);font-family:var(--display);font-size:21px;font-weight:800;text-align:center;opacity:0;pointer-events:none}
.status.show{animation:status .78s var(--ease)}
.shot-grade{position:absolute;left:50%;bottom:4%;z-index:11;min-width:108px;padding:4px 10px;transform:translateX(-50%);border-radius:8px;background:rgba(5,14,25,.72);color:#d9ebf8;font-size:11px;font-weight:800;text-align:center;opacity:0;transition:opacity .2s}
.shot-grade.show{opacity:1}
.confetti{position:absolute;inset:0;z-index:14;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-16px;width:7px;height:12px;border-radius:2px;animation:fall 1.4s linear forwards}

.controls{position:relative;z-index:10;flex:0 0 auto;padding:9px 12px calc(10px + env(safe-area-inset-bottom));background:var(--shell-2);border-top:1px solid var(--line)}
.control-row{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:9px;direction:ltr}
.side-meter{display:grid;height:52px;place-items:center;color:var(--muted);font-size:22px;font-weight:800}
.shoot{position:relative;height:58px;overflow:hidden;border:0;border-radius:8px;background:var(--gold);box-shadow:0 4px 0 #ad7811;color:#152032;cursor:pointer;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:0}
.shoot::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.18);transform:translateY(-100%);transition:transform .18s}
.shoot:active{transform:translateY(2px);box-shadow:0 2px 0 #ad7811}
.shoot:active::after{transform:translateY(0)}
.shoot:disabled{cursor:default;filter:saturate(.6);opacity:.65}

.overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px calc(28px + env(safe-area-inset-bottom));background:rgba(4,11,20,.88);text-align:center;transition:opacity .25s}
.overlay[hidden]{display:none}
.eyebrow{color:var(--cyan);font-size:12px;font-weight:800}
.overlay h1{max-width:100%;margin:4px 0 6px;font-family:var(--display);font-size:34px;font-weight:800;line-height:1.15;letter-spacing:0}
.overlay p{max-width:330px;margin:0;color:#c8d8e6;font-size:14px;font-weight:700;line-height:1.55}
.versus{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0;font-family:var(--display);font-size:18px;font-weight:800}
.versus .flag{font-size:34px}.versus b{color:var(--gold);font-size:13px}
.mission{display:grid;width:min(100%,320px);grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px}
.mission div{padding:10px 8px;border-top:1px solid #3d627e;border-bottom:1px solid #3d627e;background:rgba(19,38,56,.72)}
.mission strong{display:block;color:var(--gold);font-family:var(--display);font-size:24px;line-height:1}
.mission span{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:700}
.primary,.secondary{width:min(100%,320px);min-height:52px;border-radius:8px;cursor:pointer;font-weight:800}
.primary{border:0;background:var(--green);box-shadow:0 4px 0 #12834a;color:#062214;font-family:var(--display);font-size:19px}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #12834a}
.secondary{margin-top:10px;border:1px solid #52728c;background:transparent;color:var(--text);font-size:14px}
.result-score{margin:10px 0 0;color:var(--gold);font-family:var(--display);font-size:68px;font-weight:800;line-height:1}
.result-label{color:var(--muted);font-size:12px;font-weight:800}
.result-stats{display:grid;width:min(100%,320px);grid-template-columns:1fr 1fr;margin:18px 0;border-top:1px solid #3d627e;border-bottom:1px solid #3d627e}
.result-stats div{padding:10px}.result-stats div+div{border-inline-start:1px solid #3d627e}
.result-stats strong{display:block;font-family:var(--display);font-size:22px}.result-stats span{color:var(--muted);font-size:11px;font-weight:700}
.reward-result{display:flex;align-items:center;justify-content:center;gap:8px;max-width:330px;margin:8px 0 17px;color:#dbe9f5;font-size:14px;font-weight:800}
.reward-result img{width:28px;height:28px;object-fit:contain}

@keyframes ready{0%,100%{transform:translate(-50%,-50%) scaleY(1)}50%{transform:translate(-50%,-50%) scaleY(1.035)}}
@keyframes kick{0%{transform:translate(-50%,-100%)}30%{transform:translate(-20%,-116%) rotate(-10deg)}48%{transform:translate(-14%,-119%) rotate(10deg)}100%{transform:translate(-50%,-100%)}}
@keyframes lock{0%{transform:scale(1)}45%{transform:scale(1.26)}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
@keyframes net{0%{opacity:0;transform:scale(1)}30%{opacity:.75;transform:scale(1.035)}100%{opacity:0;transform:scale(1)}}
@keyframes status{0%{opacity:0;transform:translate(-50%,8px) scale(.9)}22%,70%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-12px)}}
@keyframes fall{to{transform:translate3d(var(--drift),110dvh,0) rotate(520deg);opacity:.2}}
@media (max-height:680px){.topbar{padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:5px}.topline{min-height:38px}.score{height:38px}.meta-row{margin-top:5px}.controls{padding-top:6px}.shoot{height:52px}.overlay{padding-top:18px}.overlay h1{font-size:29px}.versus{margin:12px 0}.mission{margin-bottom:13px}}
@media (min-width:700px){body{background:#050b12}#app{box-shadow:0 0 40px rgba(0,0,0,.7)}.kicker{width:18%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}.keeper,.ball{transition-duration:.15s!important}}
</style>
</head>
<body>
<main id="app">
  <header class="topbar">
    <div class="topline">
      <div class="team">
        <span class="flag" id="teamFlag"></span>
        <span class="team-copy"><span class="team-label" id="youLabel"></span><span class="team-name" id="teamName"></span></span>
      </div>
      <div class="score" aria-live="polite"><span id="score">0</span><small>/ 8</small></div>
      <div class="team away">
        <span class="team-copy"><span class="team-label" id="rivalLabel"></span><span class="team-name" id="rivalName"></span></span>
        <span class="flag" id="rivalFlag"></span>
      </div>
    </div>
    <div class="progress-row" id="progress" aria-hidden="true"></div>
    <div class="meta-row">
      <span class="reward-label"><img src="assets/credit.webp" alt=""><span id="rewardLabel"></span></span>
      <span class="lives" id="lives"><span class="life">♥</span><span class="life">♥</span></span>
    </div>
  </header>

  <section class="stage" id="scene" aria-label="Penalty goal">
    <img class="stadium" src="assets/stadium-v2.webp" alt="">
    <div class="shade"></div>
    <div class="goal-zone left"><img src="assets/target-v2.webp" alt=""></div>
    <div class="goal-zone right"><img src="assets/target-v2.webp" alt=""></div>
    <div class="net-flash" id="net"></div>
    <img class="keeper idle" id="keeper" src="assets/keeper.webp" alt="">
    <img class="kicker" id="kicker" src="assets/kicker.webp" alt="">
    <img class="ball" id="ball" src="assets/ball-v2.webp" alt="">
    <div class="aim-cursor" id="aim"><img src="assets/target-v2.webp" alt=""></div>
    <div class="impact" id="impact"></div>
    <div class="status" id="status" role="status" aria-live="assertive"></div>
    <div class="shot-grade" id="grade"></div>
    <div class="confetti" id="confetti"></div>
  </section>

  <footer class="controls">
    <div class="control-row">
      <button class="sound" id="sound" type="button" aria-label="Sound">🔊</button>
      <button class="shoot" id="shoot" type="button" disabled></button>
      <span class="side-meter">◎</span>
    </div>
  </footer>

  <section class="overlay" id="startOverlay">
    <span class="eyebrow" id="gameBrand"></span>
    <h1 id="gameTitle"></h1>
    <p id="gameIntro"></p>
    <div class="versus"><span class="flag" id="startTeamFlag"></span><span id="startTeam"></span><b>VS</b><span id="startRival"></span><span class="flag" id="startRivalFlag"></span></div>
    <div class="mission">
      <div><strong>8</strong><span id="goalMission"></span></div>
      <div><strong>2</strong><span id="lifeMission"></span></div>
    </div>
    <button class="primary" id="start" type="button"></button>
  </section>

  <section class="overlay" id="resultOverlay" hidden>
    <span class="eyebrow" id="resultEyebrow"></span>
    <h1 id="resultTitle"></h1>
    <div class="result-score" id="resultScore">0</div>
    <div class="result-label" id="resultScoreLabel"></div>
    <div class="reward-result"><img src="assets/credit.webp" alt=""><span id="resultMessage"></span></div>
    <div class="result-stats">
      <div><strong id="accuracy">0%</strong><span id="accuracyLabel"></span></div>
      <div><strong id="shots">0</strong><span id="shotsLabel"></span></div>
    </div>
    <button class="primary" id="claim" type="button"></button>
    <button class="secondary" id="replay" type="button"></button>
  </section>
</main>
<audio id="music" loop preload="metadata" src="assets/penalty-theme.mp3"></audio>
<script>
(function(){
  'use strict';
  var params=new URLSearchParams(location.search);
  var LANG=(params.get('lang')||'ar').toLowerCase()==='en'?'en':'ar';
  var tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
  document.documentElement.lang=LANG;
  document.documentElement.dir=LANG==='en'?'ltr':'rtl';
  var copy={
    ar:{brand:'ماجد للتوقعات',title:'ركلة الحسم',intro:'ثمانية أهداف تفصلك عن توقع مجاني.',you:'فريقك',rival:'الخصم',reward:'التقدم نحو الرصيد المجاني',goals:'أهداف للفوز',lives:'فرص متاحة',start:'ابدأ الجولة',shoot:'سدّد',goal:'هدف!',saved:'تصدّى!',perfect:'تسديدة مثالية',good:'تسديدة قوية',risky:'زاوية خطرة',winEye:'تم فتح المكافأة',win:'أحسنت!',loseEye:'انتهت الجولة',lose:'محاولة قوية',won:'ربحت رصيد توقع مجاني.',need:'سجّل ٨ أهداف لتحصل على الرصيد.',score:'الأهداف',accuracy:'الدقة',shots:'التسديدات',claim:'استلم التوقع المجاني',send:'أرسل النتيجة',replay:'العب مجدداً',sound:'الصوت'},
    en:{brand:'Majed Predictions',title:'Penalty Rush',intro:'Eight goals stand between you and a free prediction.',you:'Your team',rival:'Opponent',reward:'Progress to free prediction',goals:'Goals to win',lives:'Chances',start:'Start round',shoot:'Shoot',goal:'Goal!',saved:'Saved!',perfect:'Perfect strike',good:'Strong strike',risky:'Risky angle',winEye:'Reward unlocked',win:'Well played!',loseEye:'Round over',lose:'Strong attempt',won:'You earned a free prediction credit.',need:'Score 8 goals to earn the credit.',score:'Goals',accuracy:'Accuracy',shots:'Shots',claim:'Claim free prediction',send:'Send result',replay:'Play again',sound:'Sound'}
  }[LANG];
  var matches=[
    [{f:'🇲🇦',ar:'المغرب',en:'Morocco'},{f:'🇵🇹',ar:'البرتغال',en:'Portugal'}],
    [{f:'🇦🇷',ar:'الأرجنتين',en:'Argentina'},{f:'🇳🇱',ar:'هولندا',en:'Netherlands'}],
    [{f:'🇧🇷',ar:'البرازيل',en:'Brazil'},{f:'🇩🇪',ar:'ألمانيا',en:'Germany'}],
    [{f:'🇫🇷',ar:'فرنسا',en:'France'},{f:'🇪🇸',ar:'إسبانيا',en:'Spain'}],
    [{f:'🇸🇳',ar:'السنغال',en:'Senegal'},{f:'🇪🇬',ar:'مصر',en:'Egypt'}]
  ];
  var pair=matches[Math.floor(Math.random()*matches.length)];
  var swap=Math.random()>.5,team=pair[swap?1:0],rival=pair[swap?0:1];
  var REWARD=8,LIVES=2,score=0,misses=0,shots=0,active=false,busy=false,aimX=50,aimDir=1,lastFrame=0,lastShot='',raf=0;
  var muted=false,audioCtx=null,master=null,noiseBuffer=null;
  try{muted=localStorage.getItem('penalty-muted')==='1';}catch(e){}

  var $=function(id){return document.getElementById(id);};
  var el={score:$('score'),progress:$('progress'),lives:$('lives'),scene:$('scene'),keeper:$('keeper'),kicker:$('kicker'),ball:$('ball'),aim:$('aim'),impact:$('impact'),net:$('net'),status:$('status'),grade:$('grade'),shoot:$('shoot'),sound:$('sound'),music:$('music'),startOverlay:$('startOverlay'),resultOverlay:$('resultOverlay'),confetti:$('confetti')};
  function name(t){return t[LANG];}
  function setText(id,value){$(id).textContent=value;}
  function setup(){
    document.title=copy.title+' - '+copy.brand;
    setText('teamFlag',team.f);setText('teamName',name(team));setText('youLabel',copy.you);
    setText('rivalFlag',rival.f);setText('rivalName',name(rival));setText('rivalLabel',copy.rival);
    setText('startTeamFlag',team.f);setText('startTeam',name(team));setText('startRivalFlag',rival.f);setText('startRival',name(rival));
    setText('gameBrand',copy.brand);setText('gameTitle',copy.title);setText('gameIntro',copy.intro);
    setText('goalMission',copy.goals);setText('lifeMission',copy.lives);setText('rewardLabel',copy.reward);
    setText('start',copy.start);setText('shoot',copy.shoot);setText('accuracyLabel',copy.accuracy);setText('shotsLabel',copy.shots);setText('replay',copy.replay);
    el.sound.setAttribute('aria-label',copy.sound);el.sound.textContent=muted?'🔇':'🔊';el.music.volume=.24;el.music.muted=muted;
    for(var i=0;i<REWARD;i++){var step=document.createElement('span');step.className='progress-step';el.progress.appendChild(step);}
    if(tg){try{tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor('#101d2b');if(tg.setBackgroundColor)tg.setBackgroundColor('#08111d');}catch(e){}}
  }
  function updateHud(){
    el.score.textContent=score.toLocaleString(LANG==='ar'?'ar-EG':'en-US');
    var steps=el.progress.children;for(var i=0;i<steps.length;i++){steps[i].classList.toggle('on',i<score);}
    var hearts=el.lives.children;for(var j=0;j<hearts.length;j++){hearts[j].classList.toggle('lost',j>=LIVES-misses);}
  }
  function precisionAt(x){return Math.max(0,1-Math.min(Math.abs(x-29),Math.abs(x-71))/21);}
  function renderAim(){el.aim.style.left=aimX+'%';el.aim.classList.toggle('hot',precisionAt(aimX)>.72);}
  function loop(now){
    if(active&&!busy){
      var dt=lastFrame?Math.min(.034,(now-lastFrame)/1000):0;lastFrame=now;
      aimX+=aimDir*dt*(27+score*1.6);
      if(aimX>=78){aimX=78;aimDir=-1;}else if(aimX<=22){aimX=22;aimDir=1;}
      renderAim();
    }else{lastFrame=now;}
    raf=requestAnimationFrame(loop);
  }
  function startRound(){
    score=0;misses=0;shots=0;active=true;busy=false;aimX=50;aimDir=Math.random()>.5?1:-1;lastShot='';
    el.startOverlay.hidden=true;el.resultOverlay.hidden=true;el.shoot.disabled=false;el.grade.classList.remove('show');clearConfetti();resetActors();updateHud();startAudio();haptic('light');
  }
  function shotDirection(x){return x<42?'left':x>58?'right':'center';}
  function shoot(){
    if(!active||busy)return;
    busy=true;shots++;startAudio();sfx('kick');haptic('light');
    var x=aimX,dir=shotDirection(x),precision=precisionAt(x),repeat=dir===lastShot?.06:0;
    var chance=Math.max(.58,Math.min(.97,.72+precision*.25-Math.max(0,score-3)*.007-repeat));
    var goal=Math.random()<chance;lastShot=dir;
    el.aim.classList.add('locked');el.kicker.classList.add('kick');
    el.grade.textContent=precision>.82?copy.perfect:precision>.48?copy.good:copy.risky;el.grade.classList.add('show');
    setTimeout(function(){
      el.ball.style.left=x+'%';el.ball.style.top='45%';el.ball.style.transform='translate(-50%,-50%) scale(.42) rotate(320deg)';
      dive(goal?missDirection(dir):dir);
    },110);
    setTimeout(function(){resolveShot(goal,x,precision);},650);
  }
  function missDirection(dir){var dirs=['left','center','right'].filter(function(d){return d!==dir;});return dirs[Math.floor(Math.random()*dirs.length)];}
  function dive(dir){
    el.keeper.className='keeper dive '+dir;
    el.keeper.src=dir==='left'?'assets/keeper_left.webp':dir==='right'?'assets/keeper_right.webp':'assets/keeper.webp';
  }
  function resolveShot(goal,x,precision){
    el.impact.style.setProperty('--hit-x',x+'%');el.impact.className='impact '+(goal?'goal':'save');
    el.status.textContent=goal?copy.goal:copy.saved;el.status.style.color=goal?'var(--gold)':'var(--red)';el.status.classList.remove('show');void el.status.offsetWidth;el.status.classList.add('show');
    if(goal){
      score++;sfx('goal');haptic('medium');el.net.classList.remove('goal');void el.net.offsetWidth;el.net.classList.add('goal');
      if(score>=REWARD){updateHud();setTimeout(function(){finish(true);},820);return;}
    }else{
      misses++;sfx('save');haptic('heavy');
      if(misses>=LIVES){updateHud();setTimeout(function(){finish(false);},820);return;}
    }
    updateHud();setTimeout(resetActors,820);
  }
  function resetActors(){
    el.keeper.className='keeper idle';el.keeper.src='assets/keeper.webp';
    el.kicker.classList.remove('kick');el.aim.classList.remove('locked');
    el.ball.style.transition='none';el.ball.style.left='50%';el.ball.style.top='68%';el.ball.style.transform='translate(-50%,-50%) scale(1) rotate(0)';void el.ball.offsetWidth;el.ball.style.transition='';
    el.impact.className='impact';el.net.className='net-flash';el.grade.classList.remove('show');busy=false;lastFrame=performance.now();
  }
  function finish(won){
    active=false;busy=true;el.shoot.disabled=true;el.resultOverlay.hidden=false;
    setText('resultEyebrow',won?copy.winEye:copy.loseEye);setText('resultTitle',won?copy.win:copy.lose);setText('resultScore',score.toLocaleString(LANG==='ar'?'ar-EG':'en-US'));setText('resultScoreLabel',copy.score);
    setText('resultMessage',won?copy.won:copy.need);setText('accuracy',Math.round(score/Math.max(1,shots)*100)+'%');setText('shots',shots.toLocaleString(LANG==='ar'?'ar-EG':'en-US'));
    setText('claim',won?copy.claim:copy.send);$('claim').style.display=tg?'block':'none';
    if(won){confetti();sfx('win');haptic('medium');}
  }
  function submit(){
    if(!tg)return;
    try{tg.sendData(JSON.stringify({score:score,team:name(team),t:params.get('t')||''}));tg.close();}catch(e){}
  }
  function confetti(){
    var colors=['#ffd34f','#48d7ff','#35df87','#ff5968','#ffffff'];
    for(var i=0;i<34;i++){var p=document.createElement('i');p.style.left=(Math.random()*100)+'%';p.style.background=colors[i%colors.length];p.style.setProperty('--drift',((Math.random()-.5)*120)+'px');p.style.animationDelay=(Math.random()*.32)+'s';el.confetti.appendChild(p);}
  }
  function clearConfetti(){el.confetti.textContent='';}
  function haptic(kind){if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.impactOccurred(kind);}catch(e){}}}
  function ensureAudio(){
    if(audioCtx)return audioCtx;
    try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=muted?0:1;master.connect(audioCtx.destination);var length=audioCtx.sampleRate*.45;noiseBuffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate);var data=noiseBuffer.getChannelData(0);for(var i=0;i<length;i++)data[i]=Math.random()*2-1;}catch(e){audioCtx=null;}
    return audioCtx;
  }
  function startAudio(){var ctx=ensureAudio();if(ctx&&ctx.state==='suspended'){ctx.resume().catch(function(){});}if(!muted){el.music.play().catch(function(){});}}
  function tone(freq,duration,type,volume,delay){var ctx=ensureAudio();if(!ctx||muted)return;var at=ctx.currentTime+(delay||0),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type||'sine';osc.frequency.value=freq;gain.gain.setValueAtTime(volume||.05,at);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);osc.connect(gain);gain.connect(master);osc.start(at);osc.stop(at+duration);}
  function noise(duration,volume){var ctx=ensureAudio();if(!ctx||muted||!noiseBuffer)return;var src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain(),at=ctx.currentTime;src.buffer=noiseBuffer;filter.type='lowpass';filter.frequency.value=520;gain.gain.setValueAtTime(volume,at);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);src.connect(filter);filter.connect(gain);gain.connect(master);src.start(at);src.stop(at+duration);}
  function sfx(type){
    if(type==='kick'){tone(160,.12,'sine',.08);noise(.1,.06);}
    if(type==='goal'){tone(523,.12,'triangle',.05);tone(659,.14,'triangle',.05,.09);tone(784,.2,'triangle',.055,.18);}
    if(type==='save'){tone(220,.28,'sawtooth',.045);tone(164,.3,'sawtooth',.04,.05);}
    if(type==='win'){tone(659,.14,'triangle',.05);tone(784,.15,'triangle',.05,.12);tone(1047,.35,'triangle',.06,.24);}
  }
  function toggleSound(){muted=!muted;el.sound.textContent=muted?'🔇':'🔊';el.music.muted=muted;if(master)master.gain.value=muted?0:1;try{localStorage.setItem('penalty-muted',muted?'1':'0');}catch(e){}if(!muted)startAudio();}

  $('start').addEventListener('click',startRound);el.shoot.addEventListener('click',shoot);el.sound.addEventListener('click',toggleSound);$('replay').addEventListener('click',startRound);$('claim').addEventListener('click',submit);
  setup();updateHud();renderAim();raf=requestAnimationFrame(loop);
  window.__penaltyGame={start:startRound,shoot:shoot,setAim:function(x){aimX=Math.max(22,Math.min(78,+x||50));renderAim();},state:function(){return{score:score,misses:misses,shots:shots,active:active,busy:busy,aimX:aimX};}};
})();
</script>
